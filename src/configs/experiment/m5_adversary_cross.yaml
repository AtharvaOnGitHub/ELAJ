name: m5_adversary_cross
description: >
  THE SIBLING OF m5_adversary, AND IT DIFFERS IN ONE FIELD.
  model.ecs.buffer_batches 8 instead of 0. Everything else is identical, down
  to the seed, so the pair is a controlled read on one question: should ECS
  see pairs of cells from DIFFERENT studies?

  WHY THE QUESTION EXISTS, AND IT IS NOT THE REASON FIRST WRITTEN HERE. This
  arm is a DEPARTURE from scGPT, not a closer reproduction of it. Their
  integration script sets per_seq_batch_sample = True and builds
  SubsetsBatchSampler subsets by np.where(batch_labels_array == batch_label),
  so every scGPT batch holds one study and their ECS pairs are same-study,
  exactly as the sibling arm's are. Checked in the source after the opposite
  was assumed.

  So the question is ours, not theirs: ECS is the only term in either model
  that reads cells in pairs, which makes it the only term whose behaviour
  depends on who shares a batch. Asking it to see across studies is a new
  idea, and LatentBuffer holds the last eight batches of cell embeddings,
  detached, as reference points. Eight batches is eight other studies.

  WHY NOT MIXED BATCHES INSTEAD. That is the direct fix, and PerStudyBatchNorm
  already removed the correctness reason for single-study batches. What blocks
  it is the decoder: _build_gene_queries caches a gene layout per study taken
  from is_dns[0], so a mixed batch needs a per-cell gene panel carried through
  the whole decoder. The buffer touches the latent only, where no gene layout
  exists, so it costs a ring of small tensors and no change to the data path.
  If this arm wins, the mixed-batch work becomes worth doing properly.

  WHAT THE BUFFER COSTS. The reference rows are stale by up to eight steps out
  of roughly 1,500 an epoch, and no gradient flows through them. They are also
  unbalanced by construction: whichever studies the sampler happened to serve
  last, not a stratified draw. ecs_studies is logged every batch so the
  metrics say how many studies were actually on the right-hand side; a column
  of zeros or ones means the buffer did not work and the arm is a duplicate of
  its sibling.

  THE RISK, AND IT IS LARGER HERE. ECS drives pairs below cos 0.8 apart. With
  cross-study pairs in the matrix, two cells of the same type in two studies
  that sit at 0.5 BECAUSE OF the batch effect get pushed further apart, which
  is the adversary's work undone by our own objective. That is the reason the
  sibling arm exists and the reason to run the sibling first if only one slot
  is free.

  WHAT WOULD MAKE THIS THE BETTER ARM. study_knn lower than the sibling's with
  family no worse: cross-study sharpening would then be pulling matched cells
  together rather than pushing them apart, which happens when the already-
  similar pairs across studies outnumber the batch-separated ones. WHAT WOULD
  KILL IT: study_knn higher than the sibling's, or family dropping while
  patient_knn also drops, which is fragmentation bought with biology.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/m_series/m5_adversary_cross/
seed: 24

overrides:
  training.max_epochs: 26
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 8
  training.early_stop_warmup_epochs: 6

  training.stop_metric: nb
  training.guard_metric: study_knn
  training.guard_max: 0.5
  training.block_probe_every: 2
  training.keep_every_epochs: 5

  training.gene_mask_target: 12500

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5
  model.loss.w_kl_circ: 0.1

  model.dab.hidden_dim: 256
  model.dab.n_layers: 3
  model.dab.normalise: true
  model.dab.dropout: 0.0
  model.dab.lambda_dab: 336.0

  # THE ONE FIELD THAT DIFFERS FROM m5_adversary.
  model.ecs.enabled: true
  model.ecs.threshold: 0.8
  model.ecs.buffer_batches: 8
  model.loss.w_ecs: 1400.0

  model.cce.enabled: false
  model.cce.lambda_cce: 0.05
  model.cce.block_normalise: true
  model.cce.every: 4

  model.classifier.enabled: true
  model.classifier.block: full
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  model.loss.w_cls: 40.0

  model.d_gauss: 8
  model.n_circular: 4
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
