name: m5_adversary
description: >
  THE M-SERIES, WAVE THREE. Every wave so far adjusted how HARD the adversary
  pushed. This one changes WHAT IT IS, because the thing being fooled was
  2,827 parameters wide and the encoder never had to become study-invariant
  to beat it.

  THE MEASUREMENT THAT MOTIVATES IT. Across m2_cls40's twelve epochs the
  correlation between the adversary's own loss and donor kNN is +0.883, and
  against study kNN +0.890. train_dab climbed 1.482 to 1.936 while
  patient_knn climbed 0.455 to 0.601. The blinder the adversary, the more
  identity the latent held. On m1, train_dab fell to 0.2098 against ln(11) =
  2.40 chance while study_knn sat at 0.88: the classifier was being beaten
  and the studies were still separable. Both readings say the same thing. The
  encoder was not hiding study identity, it was hiding it FROM THIS NETWORK.

  WHAT SCGPT HAS THAT WE DID NOT. Their AdversarialDiscriminator is
  nlayers-1 repeats of [Linear(d_model, d_model), LeakyReLU,
  LayerNorm(d_model)] and then an output layer: full model width, normalised,
  no dropout. Ours was one 64-unit ReLU layer with dropout 0.1. This arm is
  theirs: three Linear layers of 256, LeakyReLU, LayerNorm, dropout 0.

      width       64 -> 256, wider than the latent it classifies
      depth       2 Linear layers -> 3
      activation  ReLU -> LeakyReLU, so a reversed gradient cannot kill a
                  unit and stop policing that direction of the latent
      norm        none -> LayerNorm, which is per ROW and so does not care
                  which cells share a batch
      dropout     0.1 -> 0.0, because handicapping the classifier is the
                  defect

  WHAT IS NOT THE PROBLEM, AND WAS CHECKED. Batch composition.
  PerStudyBatchSampler puts one study in a batch, but every layer of the
  discriminator is row-wise, softmax cross entropy computes all eleven logits
  for each cell, and the gradient on one cell already raises its own study's
  logit and lowers the other ten. The K-way contrast lives inside a single
  row. There is no BatchNorm in the discriminator, so no statistic is
  confounded with the label either. Single-study batches do not starve it.

  LAMBDA IS DELIBERATELY UNCHANGED, AND IS NOT COMPARABLE. lambda_dab 336 at
  w_dab 0.5 is coefficient 168, exactly m4_tight16 and m4_edge_starved. Held
  fixed so this arm differs from m4_tight16 in the adversary's CAPACITY and
  not in its nominal pressure. But a better classifier delivers a different
  gradient at the same lambda, so READ THE EPOCH-1 GRADIENT BALANCE BEFORE
  TRUSTING THE NUMBER. m4_tight16 sat near 0.22x nb. If this arm reads much
  above 0.5x, lambda should come DOWN in the successor, not up: the r2 wave
  collapsed at 1,400x and lambda 420 was worse than 140 at the same epoch.

  ECS: THE REGULARISATION PRESSURE WE HAD NO EQUIVALENT OF. scGPT's second
  non-reconstruction term is Elastic Cell Similarity,
  mean(1 - (cos_sim - 0.8)^2) over the pairs of a batch, with ecs_thres 0.8
  in their integration config. Read the sign before reading anything else:
  minimising it MAXIMISES (cos - 0.8)^2, so pairs above 0.8 are pulled
  tighter and pairs between 0 and 0.8 are driven apart. It is an anti-collapse
  term, not a batch-correction term, and it is the only constraint either
  model places on the latent's pair geometry. CCE is not its equivalent: CCE
  compares two views of the SAME cell.

  THE RISK, WRITTEN DOWN BEFORE THE RUN. Our failure mode is the opposite of
  collapse. m3's embedding is FRAGMENTED, 62% of a cell's nearest neighbours
  sharing its donor, and a sharpening term can deepen a fragmentation as
  easily as it can rescue a collapse. Whether it helps depends on who is in
  the pair, and with one study per batch and buffer_batches 0 every pair here
  is same-study. That restricts ECS to sharpening cell-type structure WITHIN
  a study, where it cannot undo the adversary's work. The cross-study variant
  is m5_adversary_cross, and it is the more aggressive of the two.

  w_ecs 1400 IS A STARTING POINT AND MUST BE CONFIRMED AT EPOCH 1. ECS is a
  mean over pairs in [0, 1], divided by n_measured like every other per-cell
  term, so 1400 against about 14,000 measured genes is one tenth of
  reconstruction BY VALUE. Its gradient is what matters and cannot be
  predicted from that, so GradientBalance now reports ecs alongside nb and
  dab. The term is linear in w_ecs: read the ratio at epoch 1 and rescale
  once, the way w_cls 500 became 40.

  ONE MORE FIX RIDES ALONG. Nothing ever called eval() on CompositeLoss, so
  the DAB classifier's dropout was active during validation in every run to
  date, handicapping the classifier on the validation side only and inflating
  val_dab. Dropout is 0 now, so it is fixed twice over.

  EVERYTHING ELSE IS m4_tight16, FIELD FOR FIELD. d_gauss 8 plus n_circular 4
  is d_z 16; d_study 16 conditions the decoder; gene masking to 12,500;
  w_cls 40 on phase; free_bits 0.25 for 4.00 nats against ln(269) = 5.59 for
  a donor and ln(11) = 2.40 for a study; CCE off; selection on nb guarded on
  study_knn <= 0.5. If m4_tight16's result moves the latent width, THIS IS
  THE ONE FIELD TO RECONSIDER before queueing.

  WHAT WOULD SETTLE IT. study_knn below 0.5 with cross-donor family at 0.97
  or better says a competent adversary was the missing piece and the five
  waves of walking lambda were the wrong knob. train_dab near ln(11) = 2.40
  with study_knn still above 0.8 says the latent carries study in a form NO
  classifier on the latent can read, which points at the decoder's demand
  rather than at the adversary, and the honest paper is then about the
  frontier rather than about beating it.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/m_series/m5_adversary/
seed: 24

overrides:
  training.max_epochs: 26
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 8
  training.early_stop_warmup_epochs: 6

  training.stop_metric: nb
  training.guard_metric: study_knn
  training.guard_max: 0.5
  training.block_probe_every: 2
  training.keep_every_epochs: 5

  training.gene_mask_target: 12500

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5
  model.loss.w_kl_circ: 0.1

  # ── THE CHANGE THIS WAVE IS FOR ──────────────────────────────────────────
  # scGPT's discriminator shape. Written out here rather than inherited so
  # the run_config.json records what was actually fooled.
  model.dab.hidden_dim: 256
  model.dab.n_layers: 3
  model.dab.normalise: true
  model.dab.dropout: 0.0
  # Unchanged from m4_tight16 on purpose. See the description: this is
  # coefficient 168, and it is the epoch-1 gradient report that says whether
  # 168 still means what it meant.
  model.dab.lambda_dab: 336.0

  # ── THE SECOND CHANGE: ECS ───────────────────────────────────────────────
  model.ecs.enabled: true
  model.ecs.threshold: 0.8
  # 0 keeps every pair within one study. The cross-study variant is the
  # sibling arm, and it is the one that can fight the adversary.
  model.ecs.buffer_batches: 0
  model.loss.w_ecs: 1400.0

  # OFF. Measured at 0.0005x reconstruction's gradient and costing a second
  # encoder pass every fourth step.
  model.cce.enabled: false
  model.cce.lambda_cce: 0.05
  model.cce.block_normalise: true
  model.cce.every: 4

  model.classifier.enabled: true
  model.classifier.block: full
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  model.loss.w_cls: 40.0

  # d_z = 8 + 2 * 4 = 16, m4_tight16's width.
  model.d_gauss: 8
  model.n_circular: 4
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
