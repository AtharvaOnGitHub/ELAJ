paths:
  raw_dir: ${ELAJ_BASE}/data/raw
  processed_dir: ${ELAJ_BASE}/data/processed
  gene_aliases: configs/gene_aliases.yaml
  hgnc_table: ${ELAJ_BASE}/data/hgnc_complete_set.txt
  patient_id_map: ${ELAJ_BASE}/data/processed/patient_id_map.csv
  gene_mapping_issues: ${ELAJ_BASE}/data/processed/gene_mapping_issues.csv
  studies_csv: ${ELAJ_BASE}/data/processed/studies.csv
  pipeline_log: ${ELAJ_BASE}/data/processed/pipeline.log

qc:
  min_umi: 200
  min_genes: 100
  max_mt_fraction: 0.25
  min_cells_per_gene: 3
  run_scrublet: true
  scrublet_threshold: null   # null = auto-detect per dataset

logging:
  level: INFO
