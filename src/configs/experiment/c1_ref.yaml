name: c1_ref
description: >
  The c1 series reference, bare: the pathway-grouped transformer encoder,
  a Gaussian latent of 16, the bilinear decoder with tissue and platform
  covariates, and CCE every fourth step. No circular branch, no adversarial
  study term, no disease covariate. Everything else in the series is this
  plus one thing, so each addition is measured on its own.

  WHY BARE. r8_direction carried four circular dimensions that were barely
  used (findings E1 to E5) and an adversarial term that blew the latent up
  at epoch 16 of c_ref. A reference that carries both cannot say what either
  costs or buys. This one carries neither; c1_circ and c1_dab add them back
  one at a time. The DAB classifier still trains here at lambda 0, so
  val_dab reports how much study identity the latent holds without pushing
  on the encoder: expect it low (the classifier succeeds) and expect knn
  patient to be high. That is the measurement c1_dab is read against.

  THE CORPUS. configs/data/corpus_c1.yaml: controls in, garcia_alonso_2021_c
  (118,672 endometrial organoid cells, all control) out, eleven studies.
  Removing a study renumbers the study table, so nothing trained on the
  twelve-study corpora (r, c) is comparable to anything here.

  CHECKPOINT SELECTION. training.stop_metric family_knn: the checkpoint the
  run keeps and the epoch it stops at are chosen by cell-family kNN
  agreement on the validation latent (training/label_probe.py), which is
  what the paper is judged on. Model selection on validation labels; no
  gradient; test donors untouched.

  WHAT THE PROBE SAID, AND WHAT THIS RUN DOES NOT FIX. The family signal is
  lost inside the 45 group transformers (outputs/probes/r8_stages); this
  run keeps the raw-count value encoder and the same group encoders. c1_log
  and c1_valmlp act on that and are read against this run.

  EPOCH BUDGET. About 1.1 M training cells at roughly 5,000 s/epoch (no
  circular sampler, no reversed gradient, CCE every fourth step); T_max 22
  in about 31 h. CHECK THE FIRST EPOCH TIME IN THE LOG; above 7,800 s the
  run will not anneal before the wall and needs `train.sh <yaml> --resume`.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_c1.yaml

output_dir: outputs/c1_ref/
seed: 24

overrides:
  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6
  training.stop_metric: family_knn

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  # The study classifier trains and is logged (val_dab says how much study
  # the latent holds) but at lambda 0 its reversed gradient never reaches
  # the encoder. c1_dab turns it on.
  model.dab.lambda_dab: 0.0

  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false
  model.cce.every: 4

  # Gaussian only, at the width r8's combined latent had (8 + 4 circles as
  # cos/sin = 16). c1_circ hands 8 of these to four circles.
  model.d_gauss: 16
  model.n_circular: 0
  model.d_platform: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: true
