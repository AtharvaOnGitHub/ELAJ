name: p3_dab168_kl1
description: >
  THE ADVERSARY AT m5's STRENGTH, THE LATENT CHEAP. lambda_dab 168,
  w_kl_gauss 1. Cell (168, 1) of the square.

  THE MECHANISM THIS ARM TESTS. m3's diagnostic is the clearest measurement this
  project has made about the adversary: the discriminator's loss correlated
  +0.883 with donor kNN. The encoder was not discarding study, it was HIDING
  study from the classifier -- fooling it while leaving the information in the
  geometry, which is what +0.883 means and what makes a fooled adversary no
  evidence at all. On m1, train_dab fell to 0.2098 against chance ln(11) = 2.398
  while balanced study purity sat at 0.88.

  So the prediction is that lambda_dab 168 buys little here. With the latent
  cheap, hiding is affordable: there is enough capacity to carry both the study
  information and a representation that the discriminator cannot read off it.
  The adversary should only bite when capacity is ALSO scarce, which is an
  interaction, and if it holds it is the explanation for why m5 was the only arm
  in the project's history to reach study mixing 0.504.

  WHAT IS PREDICTED, BEFORE THE RUN.

      donor kNN                0.48-0.58, i.e. close to p1_dab7_kl1's
      study mixing             0.70-0.82, i.e. close to p1_dab7_kl1's
      cross-donor phase        0.58-0.65
      cross-donor family       >= 0.960
      train_dab                well below chance ln(11) = 2.398 WHILE study
                               mixing stays high -- the fooled-but-separable
                               signature

  THE FALSIFIER IS SHARP. If n3 reaches donor kNN near 0.42 and study mixing
  near 0.55 at w_kl_gauss 1, the adversary works on its own, there is no
  interaction, and lambda_dab alone is the frontier knob -- which would be the
  cleanest possible outcome for the paper and the opposite of what is written
  here. Read n1 and n3 side by side first; the difference between them IS the
  main effect of lambda_dab at a cheap latent.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/p_series/p3_dab168_kl1/
# 24, m5_combined's seed, on all five arms. The factorial measures two knobs
# and a seed difference would be a third.
seed: 24

overrides:
  # ── THE TWO KNOBS. Everything below this block is m5_combined's value. ──
  model.dab.lambda_dab: 168.0
  model.loss.w_kl_gauss: 1.0

  # ── THE HORIZON: ONE VALUE FOR THE WAVE, AND IT IS A SHAPE NOT A LENGTH ─
  # max_epochs is not a stopping point. build_scheduler sets
  # T_max = max_epochs on CosineAnnealingLR stepped once per epoch, and
  # kl_annealing.warmup_fraction and the DAB ramp are both fractions of
  # total_steps = len(train_loader) * max_epochs. It is an optimisation
  # variable, so it is one value across the wave or the arms are not
  # comparable.
  #
  # WHAT ACTUALLY ENDS A RUN HERE IS EARLY STOPPING, and that is measured:
  # m3_study_raw ran 17 of 26, m4_tight16 19 of 26, m4_edge_starved 19 of 26,
  # m5_combined 9 of 12. NO ARM IN THIS PROJECT HAS EVER REACHED max_epochs.
  # So the horizon has only ever set the shape of the cosine, which is also
  # the reading m6_drain_circ wrote down: "20, and chosen for the SHAPE of
  # the schedule rather than the length".
  #
  # THE SHAPE MATTERS BECAUSE THE TAIL GOES TO ZERO. At T_max 12 and base lr
  # 1e-3, epoch 10 runs at 6.7% of base and epoch 11 at 1.7%: the last two
  # epochs of a 12-epoch horizon are nearly learning-rate-free. At T_max 20
  # the same epochs run at 50.0% and 42.2%. An arm still descending late --
  # m6_drain reached its minimum val_nb at its FINAL epoch, and all six R7
  # and R8 arms had their best epoch last -- is capped by the shape rather
  # than by its configuration.
  #
  # SO: 20 FOR THE SHAPE, early stopping for the length, which is the reading
  # db7dc26 took for 26 and m6_drain_circ for 20. A horizon that is never
  # reached costs nothing; one that is reached caps the arm. 20 epochs at the
  # measured 58 min/epoch is 19.3 h against a two-day wall.
  #
  # THE EXPECTATION, PRE-REGISTERED: every arm converges and early-stops
  # within 15 epochs. THE CHECK: if an arm's best val_nb epoch is its LAST
  # one, early stopping never fired and the run ended because it ran out of
  # epochs rather than because the model stopped improving. That arm did not
  # converge in 20 epochs and the table says so. No claim is made about where
  # its metrics would have gone, because we would not know.
  training.max_epochs: 20
  training.early_stop_patience: 5
  training.early_stop_warmup_epochs: 2
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 3
  training.block_probe_every: 2
  training.keep_every_epochs: 1

  # ── NO CHECKPOINT GUARD ────────────────────────────────────────────────
  # WHERE THE GUARD CAME FROM, because it was not built as a study_knn
  # ceiling. effa916, 1 October, created CheckpointRanking for m1 as
  # stop_metric phase_knn_xdonor guarded on nb <= 0.4332, to protect the axis
  # NOT being selected on: "v1_bottleneck reached its best phase numbers in
  # epochs whose reconstruction had already gone past baseline, and a
  # selector without a guard would have called one of those the model."
  #
  # It inverted the next day, 2205ff9, for a reason that still holds: "Phase
  # cannot select here: on the validation split its chance is 0.664 against
  # 0.380 on val+test, so val is phase-degenerate, and m1's selector moved
  # 0.030 across sixteen epochs inside a documented noise band of +/-0.04."
  # So nb is the selector NOT because reconstruction is the objective but
  # because it is the only non-degenerate selector val offers, and the guard
  # moved to study_knn to keep the structure: select on one axis, constrain
  # the other.
  #
  # WHAT IT ACTUALLY DID. At guard_max 0.5, m2/m3/m4: never bit -- the lowest
  # study_knn any arm has recorded is 0.6505, so every epoch breached, every
  # rank took the same constant penalty, and selection fell back to pure nb.
  # At 0.65, m5: bit, val_study_knn 0.554 -> 0.720. At 0.80, m6: raised
  # explicitly because at w_kl_gauss 1 no epoch would qualify and the
  # selection would be vacuous.
  #
  # WHY IT GOES. CheckpointRanking.breached is `value > guard_max`, so a
  # guard can only be an UPPER bound. That leaves two content-bearing
  # choices: nb, which is near-vacuous when nb is also the selector, or a
  # donor axis, which is one of the frontier's own coordinates and whose
  # ceiling m6 already had to retune per arm to stay non-vacuous. This wave
  # varies w_kl_gauss BY DESIGN, so one ceiling would be active on half the
  # square and vacuous on the other half. There is no third option.
  #
  # WHAT IS GIVEN UP: protection against an arm whose lowest-nb epoch has
  # catastrophic study mixing. That is m1's original lesson pointed the other
  # way and it is a real risk.
  #
  # WHAT REPLACES IT AT NO COST: keep_every_epochs 1, so every epoch is on
  # disk; the reporting rule is declared in RETRAIN_EXPECTATIONS as the epoch
  # with the lowest val_nb; and each arm's table row carries its
  # val_study_knn at that epoch, so anything passed over is visible rather
  # than silently rejected.
  #
  # Leaving guard_metric unset gives CheckpointRanking guard=None, and
  # trainer.py logs "no guard" at construction, so the record says so before
  # the run saw any data.
  training.stop_metric: nb

  # Just under the smallest panel of 13,144. m5's value.
  training.gene_mask_target: 12500

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  # 0.05, m5's value, unchanged. Both schedule ramps are fractions of
  # total_steps = len(train_loader) * max_epochs, so at this horizon the beta
  # ramp finishes at epoch 1.0 rather than m5's 0.6 and the DAB ramp saturates
  # at epoch 10 rather than 6. Recorded because it is true, not as a problem
  # to fix: both are identical across all five arms and so cannot confound the
  # factorial.
  training.kl_annealing.warmup_fraction: 0.05
  # Inert: no circular branch on any arm of this wave.
  model.loss.w_kl_circ: 2.0
  # Not a lever, and that is MEASURED, not assumed: m4_tight16's latent sat
  # 14x above the 4.00-nat floor, so the allowance never bound. Held at 0.25
  # because changing a knob known to do nothing would only add a variable.
  model.loss.free_bits: 0.25

  # The adversary's SHAPE, held fixed: scGPT's AdversarialDiscriminator,
  # three 256-unit LeakyReLU layers with LayerNorm and no dropout. Only
  # lambda_dab moves in this wave, and lambda_dab is read against THIS
  # adversary -- the project's historical low of 7 was measured against the
  # one 64-unit layer that r1-m4 used, which delivers a smaller gradient at
  # the same lambda. 7 here is not m3's 7.
  model.dab.hidden_dim: 256
  model.dab.n_layers: 3
  model.dab.normalise: true
  model.dab.dropout: 0.0
  model.loss.w_dab: 0.5

  model.ecs.enabled: true
  model.ecs.threshold: 0.8
  # 0, so pairs stay within one study. PerStudyBatchSampler puts one study in
  # each batch; the cross-study variant would drive apart two cells of one
  # type that sit at low cosine BECAUSE of the batch effect, undoing the
  # adversary's work with our own objective.
  model.ecs.buffer_batches: 0
  model.loss.w_ecs: 50.0

  # Measured at 0.0005x reconstruction's gradient and costing a second
  # encoder pass every fourth step.
  model.cce.enabled: false

  model.classifier.enabled: true
  model.classifier.block: gaussian
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  model.loss.w_cls: 40.0

  # d_z = d_gauss alone. 16, m5's width, on all five.
  model.d_gauss: 16
  model.n_circular: 0
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8

  # NO DRAIN AND NO BLANKING ON ANY ARM OF THIS WAVE. The drain is out of the
  # main paper: m6 held its own targets without relieving the biology block,
  # and one arm failing to work is not evidence that the mechanism cannot.
  # It stays in the repository and the supplement, unmixed with the frontier.
  model.drain.enabled: false
