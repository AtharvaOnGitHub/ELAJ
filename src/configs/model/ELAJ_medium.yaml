name: ELAJ_medium

# Latent geometry
# d_z = d_gauss + 2*n_vMF = 32 + 16 = 48  (same as small; circular dims unchanged)
# d_gene_rep = d_token + d_agg = 32 + 128 = 160
#
# d_token 32 is the first-run operating point from the parameter /
# effective-gene-space analysis (D ~= 16 K, G ~= 500, d in 20-50).
d_token: 32
d_agg: 128
d_gauss: 32
n_vMF: 8
d_dec: 64
# Tissue conditions the decoder instead of the encoder, so the latent does
# not have to spend capacity on which site a cell came from.  Kept narrow:
# it carries four categorical levels, and a wide one would let the decoder
# lean on tissue for structure the latent should be learning.
d_tissue: 16
# Technical covariates for the decoder. 0 disables them; the encoder never sees
# them either way. Same width as d_tissue -- both are small categorical
# conditions and neither should rival d_agg.
d_platform: 16
n_groups: null
n_studies: null

group_encoder:
  n_layers: 2
  n_heads: 4         # 32 / 4 = 8 dims per head
  dropout: 0.1
  # Size buckets for the 45 group encoders.  Real gene counts run 253-493,
  # and one padded block spends 49% of its attention arithmetic on padding.
  n_buckets: 4

aggregation_encoder:
  n_layers: 2
  n_heads: 4         # 128 / 4 = 32 dims per head
  dropout: 0.1

decoder:
  linear_only: true

cce:
  enabled: false
  temperature: 0.07
  lambda_cce: 0.1

dab:
  lambda_dab: 1.0
  hidden_dim: 64
