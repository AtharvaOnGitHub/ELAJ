name: r5_platform_on
description: >
  The technical covariates live. The reference arm of wave R5.

  Wave R5. Does telling the decoder which machine made a cell stop the latent
  from encoding it?

  Four codes per cell -- assay family, chemistry, sequencer, material -- come
  from a static lookup built by hand from the source papers and GEO/ArrayExpress
  records, with per-sample overrides where a study is not uniform (lin_2023 ran
  ten samples on a NovaSeq 6000 and three on a HiSeq 2000). They are summed into
  a 16-dimensional vector and handed to the DECODER, alongside tissue. The
  encoder never sees them.

  That asymmetry is the whole idea, and it is the scVI pattern rather than
  anything new. A latent dimension spent recording "this cell came off a
  NextSeq" is a dimension not spent on biology, but the model only spends it
  because the decoder needs that information to predict counts well. Give the
  decoder the fact directly and the encoder has no reason to carry it. This is
  the opposite lever from DAB, which leaves the incentive in place and punishes
  the encoder for responding to it -- and which has not worked in four waves.

  Everything else is the wave R4 operating point: the tiny latent that gave the
  best reconstruction AND the best mixing in R4, and the thin group encoders
  that cost 1.6pp of reconstruction for 45% less wall time.

  This arm is what r5_platform_off, r5_nodab_platform and r5_eutopic_platform
  are each read against, one variable at a time. It replaces a run launched
  from r4_thin_groups.yaml before that config was pinned back to d_platform 0 --
  same model, but named for the wave it belongs to and writing to its own
  output directory.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/r5_platform_on/
seed: 24

overrides:
  training.max_epochs: 30
  training.batch_size: 256
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  # ---- shared base, unchanged since wave R4 ----
  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_vmf: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5
  model.dab.lambda_dab: 0.02

  # ---- the tiny latent, as in r4_tiny_latent ----
  model.d_gauss: 8
  model.n_vMF: 4

  # ---- thin group encoders, as in r4_thin_groups ----
  model.group_encoder.n_layers: 1
  model.aggregation_encoder.n_layers: 2

  # Stated rather than inherited. ELAJ_small already sets 16, but the entire
  # wave turns on this number and a reader should not have to open a second
  # file to find out whether the covariates were on.
  model.d_platform: 16
