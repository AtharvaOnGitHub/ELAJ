name: r1_dab_005
description: >
  The adversary at lambda 0.05, at the middle learning rate.

  Wave R1. Six arms around s1_circ_low's configuration, on the corrected corpus.

  **s1_circ_low's 0.3605 is not the target and cannot be.** Three things changed
  underneath it: wang_2022 joined (49,606 adenomyosis cells, 8 live studies to
  9), the patient split is now stratified by study so the validation set is a
  different set of donors, and the gradient clip no longer shares one budget
  between the model and the DAB classifier. The baseline is recomputed per run
  and will not be 0.3917 either. r1_ref re-runs the exact configuration so the
  gap is measured rather than guessed; every other arm is read against r1_ref,
  not against anything from before.

  Read val_dab against ln(9) = 2.197, not ln(8) = 2.079 — wang_2022 adds a
  ninth study the classifier can be asked about.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/r1_dab_005/
seed: 24

overrides:
  training.max_epochs: 20
  training.batch_size: 256
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 4

  # Early stopping is live and scores val_nb. A converged arm now ends itself
  # and frees the queue for the next one, which matters at six runs two at a
  # time.
  training.early_stop_patience: 5
  training.early_stop_warmup_epochs: 3

  # ---- the variable ----
  # Still the only untested scale. lambda 1.0 ran under a broken circular KL,
  # 0.2 ran with the classifier outside the gradient clip and diverged to
  # val_dab 18.5, and 0.05 ran together with free bits. This is 0.05 alone,
  # with the clip fixed.
  #
  # At 0.05 in s1_freebits val_dab landed at 2.550 against a chance of 2.079 —
  # the closest any run has come. Chance is now 2.197.
  training.optimizer.lr: 1.0e-3
  model.loss.w_kl_vmf: 0.1
  model.dab.lambda_dab: 0.05

  # Pinned to 0 so this config still reproduces the run it names. ELAJ_small
  # gained d_platform 16 in wave R5; without this line every pre-R5 config
  # would silently start training a platform-conditioned decoder and stop
  # being a record of what was actually run.
  model.d_platform: 0
