name: m5_tight
description: >
  THE ATTEMPT AT THE PAPER'S MODEL. Not a comparison with anything. Every
  belief this campaign has earned, set to the value I would bet on, with the
  circular branch intact because it is the architecture's central claim.

  THE ONE MECHANISM THAT HAS EVER MOVED DONOR-BLINDNESS IS THE PRICE OF
  LATENT CAPACITY. The other two are measured failures. The adversary's own
  loss correlates +0.883 with donor kNN and +0.890 with study kNN across
  m2_cls40, so fooling the classifier better leaves MORE identity in
  neighbour distance; five waves of walking lambda from 0.2 to zero found
  nothing. Decoder conditioning leaves the study embedding nearly unused,
  0.0149 nats per gene for a wrong study against 0.1118 for a wrong latent.

  THE ALLOWANCE, WITH THE ARITHMETIC CORRECTED. free_bits is nats per KL
  dimension, clamped per dimension per branch, so the rent-free allowance is
  (d_gauss + n_circular) x free_bits. It is NOT d_z x free_bits: d_z counts
  each angle twice because the latent hands it downstream as a (cos, sin)
  pair, while the KL charges once per angle. EVIDENCE 7k was overstated by
  n_circular x free_bits for every arm with a circle.

      m3_study_raw       24 KL dims x 0.25 = 6.00 nats   0.6173 patient, 0.9834 family
      m4_tight16         12 KL dims x 0.25 = 3.00 nats   in flight
      m4_edge_starved     8 KL dims x 0.25 = 2.00 nats   ~0.48 patient, ~0.98 family
      THIS ARM           12 KL dims x 0.10 = 1.20 nats

  Naming one of 11 studies costs ln(11) = 2.398 nats; one of 254 donors costs
  ln(254) = 5.537. 1.20 sits below the study threshold with a factor of two
  in hand, so neither a study nor a donor can be named for free anywhere in
  this latent.

  WHY 0.10 AND NOT 0. free_bits exists because a quiet circular dimension
  cannot climb back: at kappa ~ 3e-4 the KL is about kappa^2/4 and the slope
  is kappa/2 ~ 1.5e-4, flat ground rather than a crush, and s0_lr_high lost
  7 of 8 dimensions there. At 0.10 nats a dimension sits near kappa 0.63 with
  a real gradient, so the floor still does the job it was built for while
  being too small to pay for an identity. Zero rent is m5_bare's business,
  and m5_bare drops the circle rather than risk it.

  WHY THE TRADE-OFF MAY NOT BITE. The 0.9115 cross-donor family that made a
  tight latent unpublishable came from a run carrying the loss-scaling
  defect, two DSBN bugs, no gene masking and no decoder conditioning. The
  only tight arm with all four fixed is edge_starved, whose family is 0.98.
  Between edge_starved's 2.00 nats and m3_study_raw's 6.00, donor-blindness
  improves by 0.14 while family moves 0.003.

  WHAT WOULD MAKE THIS THE PAPER'S MODEL: patient kNN at 0.45 or below with
  cross-donor family 0.97 or better. That is donor-blindness ahead of every
  baseline by 0.2 while matching them on biology, with menstrual phase
  already 0.05 ahead at p = 0.005 and a circular latent to explain why.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/m_series/m5_tight/
seed: 24

overrides:
  training.max_epochs: 26
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 8
  training.early_stop_warmup_epochs: 6

  training.stop_metric: nb
  training.guard_metric: study_knn
  training.guard_max: 0.5
  training.block_probe_every: 2
  training.keep_every_epochs: 5

  training.gene_mask_target: 12500

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_dab: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.1

  # m4_tight16's adversary, pinned because the October rebuild is the
  # repository default now. Not for attribution: this one is the KNOWN
  # quantity, and with six days left a card is not worth spending on an
  # untrained discriminator shape when the measurements say the adversary is
  # not the lever. m5_adversary carries the rebuild.
  model.dab.hidden_dim: 64
  model.dab.n_layers: 2
  model.dab.normalise: false
  model.dab.dropout: 0.1
  model.dab.lambda_dab: 336.0

  # OFF. Measured at 0.0005x reconstruction's gradient, and ECS sharpens an
  # embedding whose problem is fragmentation. Neither belongs in a run that
  # is meant to be the answer.
  model.cce.enabled: false
  model.ecs.enabled: false

  model.classifier.enabled: true
  model.classifier.block: full
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  model.loss.w_cls: 40.0

  model.d_gauss: 8
  model.n_circular: 4
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  # Kept, and at this rent it finally has a job. The 7.5 ratio that made the
  # study embedding look useless was measured at d_z 24, where the latent had
  # room to carry study rent-free and the decoder read it there. Price the
  # latent and the embedding is the only source left.
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
