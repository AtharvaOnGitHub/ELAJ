name: r5_platform_off
description: >
  The running arm with the technical covariates switched off. The control.

  Wave R5. Does telling the decoder which machine made a cell stop the latent
  from encoding it?

  r4_thin_groups is running right now with d_platform 16, and R4 ran the same
  architecture with no platform covariate at all: 81.1% kNN study purity,
  +6.21% reconstruction over the HVG baseline. It is tempting to read those two
  against each other and call the difference the platform effect.

  That reading is not safe. Between R4 and now the code gained the covariate
  wiring, a split-out encode() for CCE, a fixed FinalReporter and a PCA
  projection in the purity metric. None of them should touch training numerics,
  but "should" is doing real work in that sentence, and this project has
  already been caught once comparing across a code change.

  So this arm is the running one with a single number changed. Same seed, same
  architecture, same corpus, same wave, same binaries. The difference between
  this and r4_thin_groups is the covariate and nothing else, and it is the only
  comparison in R5 that carries no assumption.

  If purity is the same in both, the covariate is inert and the technical
  signal the latent is holding is not the one the lookup table describes.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/r5_platform_off/
seed: 24

overrides:
  training.max_epochs: 30
  training.batch_size: 256
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  # ---- shared base, unchanged since wave R4 ----
  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_vmf: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5
  model.dab.lambda_dab: 0.02

  # ---- the tiny latent, as in r4_tiny_latent ----
  model.d_gauss: 8
  model.n_vMF: 4

  # ---- thin group encoders, as in the running r4_thin_groups ----
  model.group_encoder.n_layers: 1
  model.aggregation_encoder.n_layers: 2

  # The one line that makes this arm what it is. 0 leaves decoder_platform
  # unbuilt, so the codes are read from the batch and then never used -- the
  # pre-R5 behaviour, reproduced inside R5 rather than remembered from R4.
  model.d_platform: 0
