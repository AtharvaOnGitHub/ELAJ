name: c_wide
description: >
  c_ref with the Gaussian latent four times wider. The c_ series, arm 2.

  THE HYPOTHESIS. The benchmark put the 16-wide latent below 16-component
  PCA on cell family (excess 0.84 against 0.98). The latent is the last of
  five per-cell tensors the encoder makes, and the cheapest explanation is
  that the bottleneck throws the biology away: eight Gaussian dimensions
  under a KL weight of 0.5 with free bits of 0.25 nats each, plus DAB
  pressure, is a narrow channel. If that is the cause, widening it recovers
  most of the gap without touching anything else. If it is not, this arm
  scores like c_ref and the stage probe (outputs/probes/r8_stages) says
  where else to look.

  WHAT CHANGES. d_gauss 8 to 32. n_circular stays at 4, so the combined latent
  is 40 wide. The KL terms are divided by the measured gene count and
  summed over dimensions, so four times the dimensions means four times the
  Gaussian KL at the same beta; free bits per dimension are unchanged, so
  the floor rises from 2 to 8 nats. That is the point: a wider channel with
  the same per-dimension pressure.

  WHAT IS NOT CHANGED, AND WHY. beta_max stays at 0.5, so the arm tests
  width alone. c_beta, if needed, tests pressure alone. Changing both here
  would leave the result unattributable.

  WHY 32. It is ELAJ_small's own default, which r4_tiny_latent cut to 8 on
  the argument that the circular branch needed the room. That argument was
  refuted by the mu_gauss_norm diagnostic (see r8_direction.yaml, the
  block_normalise note): the Gaussian block never grew, so it was never
  crowding the circles out. Going back to 32 is therefore a return to the
  sized configuration, not a new guess. The benchmark scoring for this arm
  should use width-matched PCA as well as PCA-16.

  EPOCH BUDGET. As c_ref: T_max 22 on about 1.2 M training cells. CHECK
  THE FIRST EPOCH TIME IN THE LOG; above 7,800 s the run will not anneal
  before the wall and needs a resume.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/c_wide/
seed: 24

overrides:
  data.include_disease_statuses: [eutopic, ectopic, adenomyosis, control]

  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.02
  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false

  # The change this arm exists for.
  model.d_gauss: 32
  model.n_circular: 4
  model.d_platform: 16

  model.group_encoder.grad_checkpointing: true
  model.kappa_floor: 1.0
  model.circular_parameterisation: direction
