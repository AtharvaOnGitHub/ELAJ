name: v1_pool_beta
description: >
  v1_pool with the KL weight lowered, 0.5 to 0.2, and nothing else changed.
  The second card. Read the two together.

  WHAT IT TESTS. Whether the prior is what is smearing the latent.

  The withdrawn ELAJ column had cross-donor cell family at 0.9115 and NMI at
  0.0159 with ARI 0.0005. Those two readings are not in conflict, they are a
  description: a cell's neighbours are overwhelmingly the right family, and yet
  Leiden clustering of the same latent recovers no cell type at all. Local
  structure is right; global structure is absent. That is what a latent whose
  clusters have been pulled together until they overlap looks like, and pulling
  everything toward N(0, I) is exactly what the KL term does.

  The width argument says the same thing from the other side. PCA-16 reaches
  cross-donor family 0.9866 in sixteen dimensions with no prior at all, so
  sixteen numbers are demonstrably enough to separate these families. ELAJ's
  sixteen were not. The difference between them is not capacity.

  WHY THIS IS A SEPARATE CARD RATHER THAN A KNOB TURNED IN v1_pool. beta is
  the only remaining change with a mechanism behind it rather than a guess, and
  it pulls against DAB: both want the latent to discard something, and running
  them up together would leave a bad result unattributable between them. One
  card each is what two GPUs are for.

  WHAT WOULD COUNT AS AN ANSWER. NMI and ARI are the diagnostic, not cell
  family. If this arm lifts NMI off the floor while holding cross-donor family
  near v1_pool's, the prior was the constraint and the latent programme should
  be about beta, free bits and the posterior rather than about width. If NMI
  stays near zero at beta 0.2, the prior is not the explanation and the
  smearing comes from somewhere else, which is worth knowing before the frozen
  latent sweep spends eight arms on it.

  THE RISK. A weaker KL means a posterior that can drift further from the
  prior, so watch kl_gauss and the reconstruction together: if val_nb improves
  while kl_gauss climbs steeply, the latent is buying reconstruction by
  memorising, and the run is not the win it appears to be.

  Note the interaction with free_bits, which is per dimension: 0.25 over 32
  dimensions is an 8-nat floor. Between the wider latent and this beta, the KL
  is considerably looser here than the single number suggests. That is the bet.

  Everything else is v1_pool exactly: same corpus, same vocabulary, same seed,
  same epoch budget, same stop metric, same architecture.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/v_series_runs/v1_pool_beta/
seed: 24

overrides:
  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6
  training.stop_metric: family_knn

  training.optimizer.lr: 1.0e-3

  # THE ONE CHANGE FROM v1_pool.
  training.kl_annealing.beta_max: 0.2

  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.01

  model.cce.enabled: true
  model.cce.lambda_cce: 0.05
  model.cce.block_normalise: false
  model.cce.every: 4

  model.d_gauss: 32
  model.n_circular: 0
  model.d_platform: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: true

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
