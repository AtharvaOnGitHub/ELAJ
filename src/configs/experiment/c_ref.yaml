name: c_ref
description: >
  r8_direction on the c_ series corpus: the control donors in. The reference
  arm every later c_ arm is compared against.

  WHY NOW. The baseline benchmark (outputs/benchmarks/r8_all) put r8_direction
  below 16-component PCA on every biology metric, as excess over chance:
  0.84 on same-family neighbours against 0.98, 0.75 on the cross-donor
  family test against 0.98, 0.12 on cross-donor phase against 0.29 to 0.63.
  In raw terms ELAJ puts 5% of a cell's family neighbours in the wrong
  family where PCA puts 0.5%. The latent is under-resolved and the work is
  training. A retrain is the moment to lift the deadline exclusion of
  controls, because the corpus, the splits, and the reference checkpoint
  all change anyway, and a model that has never seen normal endometrium has
  no reference for what "different in endometriosis" means.

  WHAT CHANGES AGAINST r8_direction. One thing: data points at
  configs/data/corpus_c.yaml, the same twelve studies with the control
  donors included. Everything else, CCE on every step included, is
  r8_direction's operating point.

  THE TWO REFERENCES. This arm keeps CCE as r8 had it. c_nocce is the same
  model without CCE. Together they bracket the arms that follow, which run
  CCE's second pass every fourth step (model.cce.every: 4) to take about a
  third off the epoch: an arm's number sits against a reference with more
  CCE pressure and one with none, so the cadence cannot be mistaken for the
  arm's own change.

  EPOCH BUDGET. About 1.2 M training cells. r8_direction ran 4,374 s/epoch
  on 786k cells; the estimate here is about 6,800 s, and T_max 22 is 41.6 h
  inside the two-day wall with six hours of margin. CHECK THE FIRST EPOCH
  TIME IN THE LOG; above 7,800 s the run will not anneal before the wall and
  needs `train.sh <yaml> --resume`.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_c.yaml

output_dir: outputs/c_ref/
seed: 24

overrides:
  # The change this arm exists for.

  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  # ---- r8_direction's operating point, unchanged ----
  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.02
  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false

  model.d_gauss: 8
  model.n_circular: 4
  model.d_platform: 16

  model.group_encoder.grad_checkpointing: true
  model.kappa_floor: 1.0
  model.circular_parameterisation: direction
