name: m5_priced
description: >
  ONE ARM, AND IT CHARGES FOR THE LATENT DURING EPOCH 0, BECAUSE THAT IS WHEN
  THE LATENT FILLS.

  WHAT THE TWO FINISHED m4 ARMS SHOW, and they show the SAME thing at d_z 8
  and at d_z 16, which is why latent width explains none of it.

      arm              ep0 patient  ep18 patient  ep0 family  best val_nb
      m4_tight16            0.3770        0.5291      0.9638   EPOCH 1
      m4_edge_starved       0.3896        0.4893      0.9806   epoch 10

  In both runs the most donor-blind point is EPOCH 0, after a single pass,
  with cross-donor family already at 0.964 and 0.981. Both then degrade
  monotonically on patient and study kNN for eighteen more epochs while
  phase improves. Nineteen epochs and twenty hours each to go backwards on
  the axis that matters.

  THE LATENT IS FULL BY THE END OF EPOCH 0: 43.9 nats, against a free_bits
  floor of 3.00 and ln(254) = 5.537 nats to name a donor. It never moves
  again; epoch 18 reads 44.3. And the KL's pull on the latent is 0.006x to
  0.05x of reconstruction's, because `w_kl_gauss` has been 1.0 in every
  config this project has ever run.

  SO THE PRICE HAS TO ARRIVE BEFORE THE FILL, AND THAT IS A SCHEDULE
  QUESTION, NOT A WEIGHT QUESTION. beta ramps from 0 over warmup_fraction of
  total steps. At 0.20 it completes at epoch 5.2, so even at w_kl_gauss 20
  the effective beta DURING epoch 0 is 1.92: the latent still fills, and then
  gets charged for contents it already has. An earlier draft of this arm did
  exactly that and called it the measured bet; it was misaimed.

      warmup_fraction   beta full at   effective beta in epoch 0   final
      0.20 (m4, draft)     epoch 5.2                   0.10 / 1.92   0.5 / 10
      0.02 (this arm)      epoch 0.5                         10.0        10

  WHY w_kl_gauss 20 AND NOT 60. A second draft paired warmup_fraction 0.02
  with w_kl_gauss 60, an effective beta of 30, which is past the 1-20 band
  the literature flags for posterior collapse and past anything this project
  has tried. The timing was right and the price was not: with the ramp gone
  there is nothing left to establish reconstruction first, so the price has
  to stay inside the explored band. 20 gives an effective beta of 10, which
  is inside it, and the only collapse this project has measured sat at 469
  from the mean-versus-sum defect.

  TWO CONFIGURATION DEFECTS FIXED HERE, BOTH FOUND IN THE m4 METRICS.

  1. `guard_max` 0.5 on study_knn was UNREACHABLE. The minimum study_knn
     observed in either arm is 0.6505, at epoch 0, so every checkpoint
     breached, every rank took the same penalty, and ranking fell back to nb
     in both runs. The guard has been decorative. 0.70 is reachable at the
     early epochs only, so it will actually bind, and it is declared here
     before the run rather than chosen after it. Note for Methods: the guard
     IS part of selection, so the sentence promising that no reported metric
     took part is wrong as written and needs to say that selection used
     reconstruction loss subject to a pre-declared ceiling on study
     separability, with no biological label involved.

  2. `keep_every_epochs` 3 with epoch 0 excluded from the schedule threw away
     the best checkpoint of both arms. Epoch 0 is retained now (see
     training/retention.py) and this arm keeps every epoch, which at the
     length below is a handful of files.

  WHAT WOULD MAKE THIS THE PAPER'S MODEL. The latent never exceeding 10 nats
  at any epoch, patient kNN at or below 0.40 holding past epoch 3 instead of
  decaying from it, study_knn under 0.70 so the guard binds, and cross-donor
  family at 0.97 or better. Phase is the term that already works: it climbed
  0.727 to 0.905 on m4_tight16 while every other axis decayed.

  WHAT WOULD KILL IT, AND IT IS READABLE IN FOUR HOURS. mu_gauss_norm
  collapsing toward zero, or median kappa below 1e-2 on more than one
  circular dimension, with val_nb above the mean-profile baseline, by epoch
  3. With the ramp removed this arm's whole risk is front-loaded, so the
  first three epochs decide it either way.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/m_series/m5_priced/
seed: 24

overrides:
  # 26 EPOCHS FOR THE SCHEDULES, EARLY STOPPING FOR THE WALL CLOCK.
  # Three schedules are keyed to max_epochs and nothing else:
  #   beta_kl       ramps over warmup_fraction x total_steps
  #   lambda_dab    ramps over the first 50% of total_steps
  #   CosineAnnealingLR  T_max = max_epochs, stepped per epoch
  # Cutting max_epochs to 12 would compress all three by 2.2x, so the run
  # would not be the first twelve epochs of m4_tight16, it would be a
  # different optimisation with a faster LR decay. 26 keeps every schedule
  # identical to m4_tight16; warm-up 2 and patience 5 end the run when it
  # stops improving, which on m4_tight16's trajectory is about epoch 7 and
  # seven hours. If it keeps improving it has earned the card.
  training.max_epochs: 26
  training.early_stop_patience: 5
  # 2, not 6. m4_tight16's best val_nb was EPOCH 1 at 0.40441 and early
  # stopping ignores warm-up epochs entirely, so the best epoch of the run
  # was invisible to it; the counter started at epoch 6 and the run went to
  # 18, ending at 0.41103. The beta ramp completes at epoch 5.2, so a run
  # that stops at 7 has seen the whole of it.
  training.early_stop_warmup_epochs: 2

  training.batch_size: 256
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 3
  training.stop_metric: nb
  training.guard_metric: study_knn
  # 0.70, not 0.5. The minimum study_knn in either m4 arm was 0.6505, so
  # 0.5 was unreachable and the guard never bound. Declared before the run.
  training.guard_max: 0.70
  training.block_probe_every: 2
  # Every epoch. Epoch 0 was the best checkpoint of both m4 arms and
  # neither kept it.
  training.keep_every_epochs: 1

  # UNCHANGED AT 12500, AND ON PURPOSE. This masker exists to equalise the
  # measured gene COUNT so the number of DNS tokens stops being a study
  # fingerprint, and 12500 sits just under the smallest panel (13,144 against
  # 15,031 for the largest), which is as far as equalisation can go. It is
  # not scGPT's masked-value objective and lowering it would not improve the
  # count fingerprint, which is already fully removed; it would only discard
  # biology.
  training.gene_mask_target: 12500

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  # 0.02, not 0.20: full price inside the first half epoch, because the
  # latent is full by the end of epoch 0. See the description.
  training.kl_annealing.warmup_fraction: 0.02

  # ── THE PRICE OF A NAT, WHICH HAS NEVER LEFT 1.0 IN ANY CONFIG ───────────
  model.loss.w_kl_gauss: 20.0
  model.loss.w_kl_circ: 2.0
  # Unchanged at 0.25, and for the first time it may actually bind. A floor
  # only matters when the model is near it; at 44 nats it was decoration.
  model.loss.free_bits: 0.25

  # CUT TO A QUARTER OF m4_tight16's 336. Its gradient report had dab at
  # 0.15x nb rising to 0.70x while patient_knn rose 0.377 to 0.529 in step,
  # which is the +0.890 correlation showing up inside a single run. Note that
  # lambda_dab ramps over the first 13 epochs, so a run stopping at 7 sees
  # about half of even this reduced value. That is acceptable here and it is
  # stated rather than hidden.
  model.loss.w_dab: 0.5
  model.dab.lambda_dab: 84.0
  model.dab.hidden_dim: 64
  model.dab.n_layers: 2
  model.dab.normalise: false
  model.dab.dropout: 0.1

  model.cce.enabled: false
  model.ecs.enabled: false

  model.classifier.enabled: true
  model.classifier.block: full
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  # The one term that demonstrably worked on m4_tight16: phase_knn_xdonor
  # climbed 0.727 to 0.905 across the run while every other axis decayed.
  model.loss.w_cls: 40.0

  model.d_gauss: 8
  model.n_circular: 4
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
