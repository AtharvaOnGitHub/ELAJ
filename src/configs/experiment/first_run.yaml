name: first_run
description: >
  First full training run on the 11-study corpus (wang_2022 and zhang_2022
  excluded).  Identical to full_model apart from a halved batch size and its own
  output directory, so full_model stays the canonical reference config.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/first_run/
seed: 24

overrides:
  # Raised from 128. Closing the decoder bypass removed ~1.1 GB of activations
  # per forward (688 MB of gene_reps, 459 MB of decoder intermediate), and the
  # job now requests an 80 GB card rather than the 40 GB one `--gres=gpu:a100`
  # was resolving to. Against that, BatchedGroupEncoder pads every group to the
  # largest (494 tokens), which adds roughly 43% to encoder activations.
  # Run 49817807 used 18.3 GB at batch 128 on the old architecture — so this
  # should land near half of an 80 GB card. If it OOMs, drop to 192.
  training.batch_size: 256

  # Denser than the default 50 because this run's job is to produce evidence,
  # not a model.
  training.diagnostics.log_every: 10
