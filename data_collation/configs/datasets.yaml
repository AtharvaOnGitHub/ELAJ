datasets:

  # ── GEO datasets with per-sample .h5 files ─────────────────────────────────

  - study_name: shih_2022
    source: geo
    accession: GSE203191
    loader: h5_per_sample
    # supplementary_metadata intentionally omitted: GSE203191_metadata.xlsx is a
    # GEO submission template with unnamed columns, not real sample metadata.
    tissue_types: [eutopic]
    has_cycle_phase: false
    tissue_ontology:
      column: "tissue"
      value_map:
        "wholeME/Metissue": "UBERON:0001295"
        "MEtissue": "UBERON:0001295"
        "wholeME": "UBERON:0001295"
      default: "UBERON:0001295"
    disease_ontology:
      default: "MONDO:0005133"  # all samples from endometriosis patients
    status_config:
      default: "eutopic"

  - study_name: tan_2022
    source: geo
    accession: GSE179640
    loader: h5_per_sample
    tissue_types: [eutopic, ectopic, control]
    has_cycle_phase: false
    tissue_ontology:
      column: "tissue"
      value_map:
        "Endometrium": "UBERON:0001295"
        "Peritoneum": "UBERON:0002358"
        "Ovary": "UBERON:0000992"
        "Patient-Derived Organoid": "UBERON:0000479"
      default: "UBERON:0001295"
    disease_ontology:
      column: "condition"
      value_map:
        "Control": "PATO:0000461"
        "Endometriosis": "MONDO:0005133"
        "Endometriosis + Control": "MONDO:0005133"
      default: "MONDO:0005133"
    status_config:
      column: "sample location"
      value_map:
        "Eutopic": "eutopic"
        "Ectopic": "ectopic"
        "Ectopic Ovary": "ectopic"
        "Ectopic Adjacent": "ectopic"
        "Mix": "other"
      override_column: "condition"
      override_map:
        "Control": "control"   # Eutopic from control patient → "control"
      default: "other"
    exclude_tissue_ontology_terms: ["UBERON:0000479"]   # drop organoid cells

  # ── GEO datasets with per-sample MTX files ──────────────────────────────────

  - study_name: ferrero_2024
    source: geo
    accession: GSE247695
    loader: mtx_per_sample
    tissue_types: [eutopic, ectopic]
    has_cycle_phase: false
    tissue_ontology:
      column: "tissue"
      value_map:
        "Eutopic endometrium": "UBERON:0001295"
        "Ectopic endometrium": "UBERON:0002358"
      default: "UBERON:0002358"
    disease_ontology:
      default: "MONDO:0005133"  # all samples from endometriosis patients
    status_config:
      column: "tissue"
      value_map:
        "Eutopic endometrium": "eutopic"
        "Ectopic endometrium": "ectopic"
      default: "eutopic"

  - study_name: lin_2023
    source: geo
    accession: GSE214411
    loader: mtx_per_sample
    tissue_types: [eutopic, control]
    has_cycle_phase: true
    # No series matrix present; metadata inferred from file names (GSM_EMS*/_N*).
    tissue_ontology:
      default: "UBERON:0001295"  # all eutopic endometrium
    disease_ontology:
      column: "source_name"      # from filename inference: "EMS" or "N"
      value_map:
        "EMS": "MONDO:0005133"
        "N": "PATO:0000461"
      default: "PATO:0000461"
    status_config:
      column: "source_name"
      value_map:
        "EMS": "eutopic"
        "N": "control"
      default: "control"

  - study_name: wang_2022
    source: geo
    accession: GSE218044
    loader: mtx_per_sample
    tissue_types: [other]        # adenomyosis — myometrium, no eutopic/ectopic
    has_cycle_phase: true
    tissue_ontology:
      default: "UBERON:0001296"  # myometrium
    disease_ontology:
      default: "MONDO:0010888"   # adenomyosis
    status_config:
      default: "other"

  - study_name: zhang_2022
    source: geo
    accession: GSE174399
    loader: mtx_per_sample
    tissue_types: [other]        # chorionic villus (decidua/placenta)
    has_cycle_phase: false
    tissue_ontology:
      default: "UBERON:0007106"  # chorionic villus
    disease_ontology:
      column: "individual"
      value_map:
        "endometriosis patient": "MONDO:0005133"
        "control": "PATO:0000461"
      default: "PATO:0000461"
    status_config:
      default: "other"           # decidua/villus, not endometrial tissue

  - study_name: fonseca_2023
    source: geo
    accession: GSE213216
    loader: mtx_per_sample
    tissue_types: [eutopic, ectopic]
    has_cycle_phase: false
    tissue_ontology:
      # Primary: anatomic location gives the most specific tissue site.
      # Fallback: tissue column used when anatomic location is missing or unmapped.
      column: "anatomic location"
      value_map:
        "Endometrium": "UBERON:0001295"
        "Left ovary": "UBERON:0000992"
        "Right ovary": "UBERON:0000992"
        "Ovary": "UBERON:0000992"
        "Left ovarian cyst": "UBERON:0000992"
        "Right ovarian cyst": "UBERON:0000992"
        "Left ovarian fossa": "UBERON:0000992"
        "Right ovarian fossa": "UBERON:0000992"
        "Anterior cul-de-sac": "UBERON:0007111"
        "Posterior cul-de-sac": "UBERON:0007111"
        "Anterior cul-de-sac ": "UBERON:0007111"   # trailing space in GEO data
        "Left uterosacral ligament": "UBERON:0007136"
        "Right uterosacral ligament": "UBERON:0007136"
        "Right and left uterosacral ligament": "UBERON:0007136"
        "Bladder endometriosis": "UBERON:0001255"
        "Rectum": "UBERON:0001052"
        "Rectal serosa": "UBERON:0001052"
        "Left pelvic side wall": "UBERON:8480043"
        "Right pelvic side wall": "UBERON:8480043"
        "Right and left pelvic side wall†": "UBERON:8480043"
        "Anterior cul-de-sac and right pelvic side wall†": "UBERON:8480043"
        "Right parametrium": "UBERON:0002358"
        "Left parametrium": "UBERON:0002358"
        "Perirectal fat": "UBERON:0002358"
        "Posterior uterus": "UBERON:0002358"
        "Anterior abdominal wall and cul-de-sac†": "UBERON:0002358"
      fallback_column: "tissue"
      fallback_value_map:
        "Eutopic Endometrium": "UBERON:0001295"
        "No endometriosis detected": "UBERON:0001295"
        "Ovary": "UBERON:0000992"
        "Endometrioma": "UBERON:0000992"
        "Endometriosis": "UBERON:0002358"
      default: "UBERON:0002358"  # peritoneum as generic ectopic fallback
    disease_ontology:
      column: "tissue"
      value_map:
        "No endometriosis detected": "PATO:0000461"
        "Eutopic Endometrium": "MONDO:0005133"
        "Endometriosis": "MONDO:0005133"
        "Endometrioma": "MONDO:0005133"
        "Ovary": "MONDO:0005133"
      default: "MONDO:0005133"
    status_config:
      column: "tissue"
      value_map:
        "Eutopic Endometrium": "eutopic"
        "No endometriosis detected": "control"
        "Endometriosis": "ectopic"
        "Endometrioma": "ectopic"
        "Ovary": "ectopic"
      default: "ectopic"

  # ── GEO dataset — Seurat .rds (requires R conversion step) ─────────────────

  - study_name: duempelmann_2026
    source: geo
    accession: GSE266265
    loader: rds
    rds_file: GSE266265_EndoAtlas.rds    # 38.9 GB — downloaded separately
    tissue_types: [eutopic, control]
    has_cycle_phase: true

  # ── CNGBdb / Figshare — requires manual download ────────────────────────────
  # Raw scRNA data: CNGBdb CNP0006183 (scRNA) and CNP0006170 (Stereo-seq).
  # Figshare (8f61bbe2395ae0df0e63) contains PROCESSED files only — not raw counts.
  # Place the raw h5ad (or h5) from CNGBdb at data/raw/GSE276193/ before running.

  - study_name: li_2025
    source: manual          # signals the pipeline to skip download and look for pre-placed files
    accession: GSE276193
    loader: rds
    rds_file: processed_seurat.rds
    tissue_types: [ectopic, other]
    has_cycle_phase: false
    note: "Raw data on CNGBdb CNP0006183 (scRNA) / CNP0006170 (Stereo-seq). Must be downloaded manually."

  # ── Reproductive Cell Atlas (E-MTAB-14039) ──────────────────────────────────

  - study_name: marecko_2024
    source: reproductive_atlas
    accession: E-MTAB-14039
    loader: h5ad
    tissue_types: [eutopic, control]
    has_cycle_phase: true
    tissue_ontology:
      default: "UBERON:0001295"   # all eutopic endometrium per Tissue_sampled column
    disease_ontology:
      column: "Group"             # exists in adata.obs; no series matrix for this study
      value_map:
        "Ctrl_Superficial": "PATO:0000461"
        "Ctrl_whole_uterus": "PATO:0000461"
        "Endo_Superficial": "MONDO:0005133"
      default: "MONDO:0005133"
    status_config:
      column: "Group"
      value_map:
        "Ctrl_Superficial": "control"
        "Ctrl_whole_uterus": "control"
        "Endo_Superficial": "eutopic"
      default: "other"
    # Drop cells already present in GSE179640 (tan_2022), GSE213216 (fonseca_2023),
    # and GSE214411 (lin_2023) which are re-aggregated here by Marecko et al.
    exclude_obs_column_values:
      dataset: ["Tan", "Fonseca", "Huang"]

  # ── CELLxGENE datasets (Garcia-Alonso et al. 2021, Nat Genetics) ────────────

  - study_name: garcia_alonso_2021_a
    source: cellxgene
    dataset_id: 9ddea8d9-cc4c-420a-90f6-880996f808d4
    loader: h5ad
    tissue_types: [eutopic, control]
    has_cycle_phase: true
    # tissue/disease ontology already present in h5ad; derive status from disease ontology.
    status_config:
      column: "disease_ontology_term_id"   # exists in adata.obs for CellxGENE files
      value_map:
        "PATO:0000461": "control"
        "MONDO:0005133": "eutopic"
      default: "other"

  - study_name: garcia_alonso_2021_b
    source: cellxgene
    dataset_id: 968885c5-b652-48d9-9006-c34b5fc1c07a
    loader: h5ad
    tissue_types: [eutopic, control]
    has_cycle_phase: true
    # tissue/disease ontology already present in h5ad; derive status from disease ontology.
    status_config:
      column: "disease_ontology_term_id"
      value_map:
        "PATO:0000461": "control"
        "MONDO:0005133": "eutopic"
      default: "other"

  - study_name: garcia_alonso_2021_c
    source: cellxgene
    dataset_id: 76150f40-1989-4977-9e23-696e72d59d9e
    loader: h5ad
    tissue_types: [eutopic, control]
    has_cycle_phase: true
    # tissue/disease ontology already present in h5ad; derive status from disease ontology.
    status_config:
      column: "disease_ontology_term_id"
      value_map:
        "PATO:0000461": "control"
        "MONDO:0005133": "eutopic"
      default: "other"
