# The v1 series corpus: the c1 corpus against a REBUILT vocabulary.
#
# Identical to corpus_c1.yaml in every field but vocabulary_path. The c1
# vocabulary was built from a gene list that excluded wang_2022, which the
# corpus trains on, and included garcia_alonso_2021_c, which it does not:
# build_vocabulary.sh carried a typed EXCLUDE list that had drifted from
# this file. The rebuild derives that list from here, so the artefact and
# the config cannot disagree again.
#
# WHAT THE REBUILD CHANGES, measured by scripts/dry_run_vocabulary.py:
# eleven genes gained (all wang_2022's, measured by no other corpus
# study), ten lost (olfactory receptors, lactalbumin, sperm proteins, none
# endometrial). The gene content is all but identical. What moves is the
# PARTITION: the merge order in UnionCutStrategy is sensitive to the gene
# list, so groups resize and the count changes. That is why a v run cannot
# be compared with a c run, and why the v series exists as its own series
# rather than as more c1 arms.
#
# Nothing trained on a c1 checkpoint loads against this vocabulary: gene
# indices renumber and group membership changes.
#
#
# Differs from corpus_c.yaml (c_ref's corpus, kept unchanged so c_ref's
# checkpoint still loads against the twelve-study table it was trained with)
# in one place: garcia_alonso_2021_c is excluded. Every c1 arm points here;
# none overrides the study list or the filter.
#
vocabulary_path: ${ELAJ_BASE}/data/processed/vocabulary_v1.json

# Studies are loaded from a CSV generated by the preprocessing pipeline.
# See docs/corpus_csv_spec.md for the required column format.
# Inline studies list below is used only for quick testing without a CSV.
studies_csv: ${ELAJ_BASE}/data/processed/studies.csv

splits:
  strategy: patient_held_out   # all cells from a patient go into one split
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 24

# UBERON term -> the four numeric tissue levels the model reads.
#
# Those four columns (tissue_compartment, tissue_organ, tissue_type,
# tissue_microsite) do not exist in ANY of the 13 studies and never have —
# nothing in collation ever wrote them, so every cell read level 0 and the
# decoder's tissue conditioning was inert. tissue_ontology_term_id IS populated
# everywhere; only the translation was missing. Set to null to go back to that.
tissue_hierarchy_csv: configs/data/tissue_hierarchy.csv

# Names for the integer level codes the file above produces. Figures only —
# the tissue UMAP panels legended "1 (16,074)" without it, which names nothing.
tissue_level_names_csv: configs/data/tissue_level_names.csv

# How each cell was made: assay family, chemistry, sequencer, material. Goes to
# the DECODER, so the latent has no reason to store the technical signal. The
# sample file overrides the study file where a study is not uniform -- lin_2023
# ran ten samples on a NovaSeq 6000 and three on a HiSeq 2000. Set both to null
# to restore the pre-R5 behaviour, where every code read 0.
study_platform_csv: configs/data/study_platform.csv
sample_platform_csv: configs/data/sample_platform.csv

dns_sentinel: -1
max_cells_per_study: null      # null = use all; integer = cap for debugging

# Studies dropped from the corpus entirely, by `name` in studies.csv.
# Surviving studies are renumbered 0..N-1 so study id stays a valid index into
# the DSBN / study-embedding tables.  An unmatched name raises rather than
# silently keeping the study.
#   zhang_2022  GSE174399 — chorionic villus / decidua, not endometrial tissue.
#     Out of scope for an endometrial atlas, excluded permanently.
#
# wang_2022 (GSE218044, adenomyosis, myometrium, four donors) stays in as the
# adenomyosis contrast, as in the r-series. It was briefly dropped on
# 18 September 2026 through a mix-up with zhang_2022 and put back the same day.
#   garcia_alonso_2021_c  CELLxGENE 76150f40 — endometrial ORGANOIDS, three
#     cultures, 118,672 cells, every one of them labelled control. The h5ad
#     says tissue_type organoid throughout (read on the cluster, 20 September
#     2026). Lab-grown cells were an exclusion criterion of the corpus and this
#     study slipped past it because its CELLxGENE listing sits beside the two
#     tissue studies from the same paper. Out from the c1 series on.
exclude_studies:
  - zhang_2022
  - garcia_alonso_2021_c

# Keep only cells with these disease_status values; empty keeps every cell.
# Unlike exclude_studies this drops cells, not studies, so study ids are
# untouched and a study reduced to nothing still holds its DSBN parameters.
#
# Controls are in: the c_ series exists to train on them.
include_disease_statuses:
  - eutopic
  - ectopic
  - adenomyosis
  - control
