name: c_gauss_dx
description: >
  c_gauss with disease status handed to the decoder. The c_ series, arm 4.

  THE QUESTION. Where does disease status belong? Every run to date kept it
  out of the model entirely: the encoder never sees it (an encoder told
  which cells are diseased separates them, and that separation demonstrates
  nothing) and neither does the decoder. This arm keeps the encoder blind
  and tells the DECODER, in the same position as tissue and platform: a
  16-wide embedding of the five status codes concatenated onto z_proj.

  WHAT THAT CHANGES ABOUT THE LATENT. A decoder that knows the status can
  rebuild the status's mean profile from a latent that never encoded it, so
  the latent is no longer obliged to carry what separates a control cell
  from a eutopic one, and what remains in it is the variation disease does
  not explain. Two consequences, and both are the point of running the
  pair:
    - the cross-donor cell-family and phase numbers should be at least
      c_gauss's, and may rise, since latent capacity spent on status is
      freed;
    - a disease signal in THIS latent is not a finding, because the answer
      was supplied to the reconstruction. c_gauss is the arm a disease
      figure can be drawn from; this one is the arm a comparison
      conditional on disease is drawn from.

  WHAT CHANGES. model.d_disease 0 to 16. One line against c_gauss.

  EPOCH BUDGET. As c_ref.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/c_gauss_dx/
seed: 24

overrides:
  data.include_disease_statuses: [eutopic, ectopic, adenomyosis, control]

  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.02
  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false

  model.d_gauss: 16
  model.n_circular: 0
  model.d_platform: 16
  # The line this arm exists for. Decoder side only; see
  # model/embeddings/disease_encoder.py.
  model.d_disease: 16

  model.group_encoder.grad_checkpointing: true
  model.kappa_floor: 1.0
  model.circular_parameterisation: direction
