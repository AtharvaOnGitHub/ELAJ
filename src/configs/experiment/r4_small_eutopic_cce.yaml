name: r4_small_eutopic_cce
description: >
  Everything reduced, contrastive on, eutopic only.

  Wave R4. Shrink the model and remove the confound, at a live adversary.

  Everything before this made the model bigger, looser, or more strongly
  regularised, and none of it changed the one number that matters: kNN study
  purity, the share of a cell's 30 nearest neighbours that come from its own
  study. Perfect mixing here is 0.125. r3_nodab reached 0.756, r3_loose 0.959,
  r3_capacity 0.982 -- and r3_capacity was the LARGEST model with the strongest
  adversary. Bigger has been worse every time.

  So this wave goes the other way. A latent with 8 Gaussian and 4 circular
  dimensions cannot hold forty separate study clumps the way a 48+12 one can;
  if the room to keep studies apart is removed, the model has to put cells
  somewhere shared or lose reconstruction. That is a hypothesis, not a
  prediction, and purity is what tests it.

  lambda_dab is 0.02 in every arm with w_dab 0.5, so encoder pressure is 0.01.
  That is r3_capacity's setting: high enough that the classifier reached chance,
  low enough that the latent did not empty as it did at 0.1 in wave R2.

  Read purity from the end-of-run log line, not the UMAP. Read val_dab against
  the label entropy printed alongside it, not ln(n_studies) -- studies are not
  equally frequent and ln(9) is roughly 0.6 nats too generous.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/r4_small_eutopic_cce/
seed: 24

overrides:
  training.max_epochs: 30
  # !! batch 128, not 256. Wave R4's two CCE arms both died with
  # torch.OutOfMemoryError on the first backward, trying to allocate 6.52 GiB
  # with 4.63 GiB free of 79.25. CCE runs a second pass over the encoder and
  # holds both graphs, and the memory is dominated by the group encoders'
  # attention: 45 groups, each (B, heads, G_k, G_k) with G_k up to 493, which
  # at B=256 is about a gigabyte per group.
  #
  # Two changes together. The second pass now calls model.encode rather than
  # model.forward, so it no longer builds a decoder graph over ~15,000 genes
  # that CCE never reads. And the batch halves, which halves the attention
  # matrices — the term that actually filled the card. Both were needed;
  # encode() alone was too close to the limit to trust.
  #
  # InfoNCE loses half its negatives at B=128. That weakens the contrastive
  # signal and is the price of running the arm at all.
  training.batch_size: 128
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  # ---- shared base, carried from the best of wave R3 ----
  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_vmf: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5
  model.dab.lambda_dab: 0.02

  # Arms 2 and 3 together. If the wave produces one configuration where purity
  # finally moves toward 0.125, this is where the odds are: smallest model,
  # least room to keep studies apart, no tissue confound, and a contrastive term
  # whose whole job is to pull two views of a cell together.
  model.dab.hidden_dim: 32
  model.cce.enabled: true
  model.cce.lambda_cce: 0.1
  data.include_disease_statuses: [eutopic]

  # ---- the tiny latent ----
  model.d_gauss: 8
  model.n_vMF: 4
  # ---- the smaller encoder ----
  # Note: the group encoders are 2 layers deep, not 8. Halving the only thing
  # that can be halved takes them to 1, so the width is cut as well to make the
  # reduction meaningful: d_token 32 -> 16 and d_agg 64 -> 32. n_heads stays 4,
  # which divides both.
  model.group_encoder.n_layers: 1
  model.aggregation_encoder.n_layers: 1
  model.d_token: 16
  model.d_agg: 32

  # Pinned to 0 so this config still reproduces the run it names. ELAJ_small
  # gained d_platform 16 in wave R5; without this line every pre-R5 config
  # would silently start training a platform-conditioned decoder and stop
  # being a record of what was actually run.
  model.d_platform: 0
