optimizer:
  name: AdamW
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: CosineAnnealingLR
  T_max: 100           # matches max_epochs

batch_size: 256
max_epochs: 100

# DataLoader worker processes.  null auto-sizes to the job's CPU allocation
# (cores visible to the process, minus one for the training step itself), so the
# same config is correct whether SLURM grants 4 cores or 16.  Set 0 to load in
# the main process — only useful for debugging, since it serialises the dense
# per-cell count rebuild against the GPU step.
num_workers: null
grad_clip_norm: 1.0
early_stop_patience: 10
val_check_interval: 1

kl_annealing:
  beta_max: 1.0
  warmup_fraction: 0.20    # KL weight ramps 0 → beta_max over first 20% of steps

diagnostics:
  # Per-step progress lines: step number, total loss, the loss breakdown, and
  # the pre-clip gradient norm.  Without these a crash mid-epoch leaves no
  # record of how far the run got, and the gradient norm is the only cheap
  # early warning that an optimisation is diverging.
  log_every: 50
  # Attribute a NaN produced in backward to the forward op that made the node.
  # 2-4x slower; turn on only once a run shows the fault arriving via gradients.
  detect_anomaly: false
  # Write the failing batch to output_dir/faults/ so it can be replayed offline
  # without rebuilding a Dataset.
  dump_faults: true
  # Drop an update whose gradients are non-finite instead of ending the run.
  # The Power Spherical sampler draws once per cell per circular latent, and a
  # boundary draw has an undefined derivative; losing a run to one draw in 10^5
  # is the wrong trade.  Consecutive skips mean a real divergence and abort.
  skip_nonfinite_steps: true
  max_consecutive_skips: 5

resume_from_checkpoint: null    # path to a checkpoint; null = train from scratch
