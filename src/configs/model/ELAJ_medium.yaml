name: ELAJ_medium

# Latent geometry
# d_z = d_gauss + 2*n_vMF = 32 + 16 = 48  (same as small; circular dims unchanged)
# d_gene_rep = d_token + d_agg = 32 + 128 = 160
#
# d_token 32 is the first-run operating point from the parameter /
# effective-gene-space analysis (D ~= 16 K, G ~= 500, d in 20-50).
d_token: 32
d_agg: 128
d_gauss: 32
n_vMF: 8
d_dec: 64
n_groups: null
n_studies: null

group_encoder:
  n_layers: 2
  n_heads: 4         # 32 / 4 = 8 dims per head
  dropout: 0.1

aggregation_encoder:
  n_layers: 2
  n_heads: 4         # 128 / 4 = 32 dims per head
  dropout: 0.1

decoder:
  linear_only: true

cce:
  enabled: false
  temperature: 0.07
  lambda_cce: 0.1

dab:
  lambda_dab: 1.0
  hidden_dim: 64
