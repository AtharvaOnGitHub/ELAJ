name: c_ref
description: >
  r8_direction on the c_ series corpus: control donors in, wang_2022 out,
  with CCE's second encoder pass every fourth step. The reference arm every
  later c_ arm is compared against.

  WHY NOW. The baseline benchmark (outputs/benchmarks/r8_all) put r8_direction
  below 16-component PCA on every biology metric, as excess over chance:
  0.84 on same-family neighbours against 0.98, 0.75 on the cross-donor
  family test against 0.98, 0.12 on cross-donor phase against 0.29 to 0.63.
  In raw terms ELAJ puts 5% of a cell's family neighbours in the wrong
  family where PCA puts 0.5%. The latent is under-resolved and the work is
  training. A retrain is the moment to change the corpus, because the
  splits and the reference checkpoint change anyway.

  WHAT CHANGES AGAINST r8_direction. Three things, all in the base and none
  an arm:
    - data: configs/data/corpus_c.yaml. Controls are in (the deadline
      exclusion is lifted; a model that has never seen normal endometrium
      has no reference for what "different in endometriosis" means) and
      wang_2022 is out (adenomyosis myometrium, four donors, no eutopic or
      ectopic cells: not endometrial tissue). Eleven studies.
    - model.cce.every: 4. CCE's second encoder pass costs about a third of
      the epoch for a term weighted 0.025; running it on every fourth step
      keeps the term and removes most of the cost. Its average pressure is
      a quarter of r8's. Unmeasured against every-step on this corpus; if
      an arm's result is ever suspected of resting on it, c_cce1 (every: 1)
      is the one-line check.
    - the first attempt of this arm (job 54525748, corpus with wang,
      every-step CCE) was stopped at epoch 9 on 18 September when wang was
      dropped. Its metrics.csv is in outputs/c_ref_wang/ if anyone wants
      the first nine epochs of that variant.

  EPOCH BUDGET. About 1.2 M training cells. r8_direction ran 4,374 s/epoch
  on 786k cells with every-step CCE; with a quarter of the second passes
  the estimate is about 5,300 s/epoch, and T_max 22 is 32 h inside the
  two-day wall. CHECK THE FIRST EPOCH TIME IN THE LOG; above 7,800 s the
  run will not anneal before the wall and needs `train.sh <yaml> --resume`.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_c.yaml

output_dir: outputs/c_ref/
seed: 24

overrides:
  # The change this arm exists for.

  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6

  # ---- r8_direction's operating point, unchanged ----
  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.02
  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false
  model.cce.every: 4

  model.d_gauss: 8
  model.n_circular: 4
  model.d_platform: 16

  model.group_encoder.grad_checkpointing: true
  model.kappa_floor: 1.0
  model.circular_parameterisation: direction
