name: kl_check_no_dab
description: >
  Three epochs to answer one question: does the latent survive now?

  Run 50132670 spent 24 hours proving the model could not learn, because the
  reconstruction term averaged over ~15,000 genes while the KL terms averaged
  over 32 and 8 latent dimensions.  beta_kl = 1.0 was an effective beta of ~469
  and ~1,875.  Both latents emptied, and the model finished 1.1% better than
  predicting each study's mean profile.

  The fix is in.  This run checks it before another day of GPU time is spent on
  the assumption that it worked, and it is short on purpose: if the latent still
  empties, the cause is somewhere else and three epochs is the right price to
  find that out.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus.yaml

output_dir: outputs/kl_check_no_dab/
seed: 24

overrides:
  # Three epochs, and the short run is itself part of the test.  The KL ramp is
  # 20% of total_steps, so beta_kl reaches its full 1.0 inside epoch 1 rather
  # than epoch 10 — the latent meets the full penalty almost immediately.  A
  # latent still carrying information at epoch 2 here is under more pressure
  # than it would be at epoch 2 of a 50-epoch run, not less.
  training.max_epochs: 3

  # Nothing may early-stop a run whose entire purpose is the shape of a curve.
  training.early_stop_warmup_epochs: 99

  training.batch_size: 256
  training.diagnostics.log_every: 10

  # Latent figures every epoch.  The circular panel states "N/8 dimensions
  # collapsed" in its title, which is the single most direct read on whether
  # the fix worked.
  training.diagnostics.latent_every: 1

  # The adversary, switched off.  This is the control for kl_check, not a
  # candidate configuration.
  #
  # PerStudyBatchSampler puts one study in every batch, because DSBN needs
  # it.  So the study classifier only ever sees a batch of identical
  # labels, and in run 50132670 its loss tracked the study's share of the
  # corpus almost exactly: duempelmann is 26% of cells and scored ~1.35,
  # garcia_alonso_b is 0.7% and scored ~4.97, against ln(11) = 2.398.  It
  # was measuring the class prior, not batch effects.
  #
  # It also carried 82% of the total loss, and the surest way for an
  # encoder to defeat a study classifier is to encode nothing at all.  If
  # this run keeps its latent and kl_check does not, the adversary is a
  # second collapse pressure and the KL scale was only half the story.
  # lambda_dab is the gradient-reversal scale. At 0 the classifier still
  # trains and `dab` is still reported, so the number stays comparable
  # against kl_check — but no reversed gradient reaches the encoder, which
  # is the pressure being tested.
  model.dab.lambda_dab: 0.0
