name: m5_masked
description: >
  THE OTHER BET: THE MODEL MEMORISES DONORS BECAUSE IT IS SHOWN WHOLE CELLS.

  m4_tight16's train_nb fell 0.4117 to 0.3726 while val_nb went 0.4044 to
  0.4110. The gap grew from 0.0015 to 0.0385 and val_patient_knn rose 0.377
  to 0.529 over the same epochs. That is memorisation, and it is the shape of
  the problem m5_priced attacks from the objective. This arm attacks it from
  the input.

  GENE MASKING HAS NEVER BEEN VARIED. `gene_mask_target` is 12500 in every
  arm that has it, including both arms named "masked" and "masked_hard",
  which differed only in lambda_dab. Against panels of 13,144 to 15,031
  genes that hides about seventeen percent of a cell. scGPT masks forty
  percent and calls the result a masked autoencoder; we have been running a
  lightly corrupted one.

  6000 HIDES SIXTY PERCENT. The encoder sees 6,000 measured genes of a cell
  and the decoder still predicts the study's full panel, so the task becomes
  genuinely predictive rather than reconstructive. Two things follow. A cell
  can no longer be recognised by its own expression vector, which is the
  route memorisation takes. And the DNS mask, which is identical within a
  study and different between studies and was a perfect study fingerprint in
  the input, is corrupted much further: masking only subtracts, so a panel
  stays a subset, but a 60% subset is a far weaker fingerprint than an 83%
  one.

  Masking is applied on TRAINING steps only, so val_nb stays comparable with
  every earlier arm and with the baselines. This arm costs nothing in
  comparability.

  WHY THE LATENT IS ALSO PRICED HERE, AT w_kl_gauss 5. Not to split the
  difference. The measurement that the latent carries 44 nats against a
  3-nat floor at 0.05x reconstruction's gradient pull is simply true, and
  leaving the price at 1.0 would mean this arm shares m4_tight16's defect
  while testing something else. 5 puts the Gaussian KL near 0.25x nb,
  beside the phase head rather than above it, so the masking is what this arm
  is betting on and the latent is merely not free.

  WHAT WOULD MAKE THIS THE PAPER'S MODEL. The train-val gap staying under
  0.01 through epoch 12, patient kNN at 0.45 or below, and val_nb beating
  m4_tight16's 0.40441. A masked autoencoder that generalises is also a
  cleaner story for the paper than a VAE that needed its latent taxed.

  WHAT WOULD KILL IT. val_nb above 0.43 by epoch 4. At sixty percent hidden
  the task may simply be too hard for a 64-wide aggregation, and that shows
  up immediately in reconstruction rather than slowly in the metrics.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_v1.yaml

output_dir: outputs/m_series/m5_masked/
seed: 24

overrides:
  # TWELVE EPOCHS, NOT TWENTY-SIX. m4_tight16's best val_nb was EPOCH 1, at
  # 0.40441, and nothing in the following seventeen epochs beat it; epoch 18
  # read 0.41103. It ran twenty hours to go backwards. Warm-up 6 is why it
  # kept going: early stopping ignores warm-up epochs entirely, so the best
  # epoch of the run was invisible to it and the counter only started at
  # epoch 6. Warm-up 2 here, and the card comes back in about thirteen hours
  # instead of twenty-eight.
  training.max_epochs: 12
  training.early_stop_patience: 5
  training.early_stop_warmup_epochs: 2

  training.batch_size: 256
  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 3
  training.stop_metric: nb
  training.guard_metric: study_knn
  training.guard_max: 0.5
  training.block_probe_every: 2
  training.keep_every_epochs: 3

  training.gene_mask_target: 6000

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5

  # ── THE PRICE OF A NAT ───────────────────────────────────────────────────
  model.loss.w_kl_gauss: 5.0
  model.loss.w_kl_circ: 0.5
  # Unchanged at 0.25, and for the first time it may actually bind. A floor
  # is only a floor when the model is near it; at 44 nats it was decoration.
  model.loss.free_bits: 0.25

  # CUT TO A QUARTER OF m4_tight16's 336. The gradient report had dab at
  # 0.15x nb rising to 0.70x while patient_knn rose 0.377 to 0.529 in step
  # with it, which is the +0.890 correlation showing up inside a single run.
  # The adversary stays in because the paper describes it, not because it is
  # expected to carry this arm.
  model.loss.w_dab: 0.5
  model.dab.lambda_dab: 84.0
  model.dab.hidden_dim: 64
  model.dab.n_layers: 2
  model.dab.normalise: false
  model.dab.dropout: 0.1

  model.cce.enabled: false
  model.ecs.enabled: false

  model.classifier.enabled: true
  model.classifier.block: full
  model.classifier.dropout: 0.0
  model.classifier.label_smoothing: 0.05
  # The one term that demonstrably worked on m4_tight16: phase_knn_xdonor
  # climbed 0.727 to 0.905 across the run while everything else decayed.
  model.loss.w_cls: 40.0

  model.d_gauss: 8
  model.n_circular: 4
  model.circular_parameterisation: direction
  model.kappa_floor: 1.0
  model.d_platform: 16
  model.d_study: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: false

  model.tokens.count_scale: log
  model.tokens.target_sum: 1.0e4
  model.tokens.value_part: gene_direction
  model.group_encoder.readout: cls+pool8
  model.aggregation_encoder.readout: cls+pool8
