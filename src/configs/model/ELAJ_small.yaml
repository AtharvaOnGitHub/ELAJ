name: ELAJ_small

# Latent geometry
# d_z = d_gauss + 2*n_circular = 32 + 16 = 48  (each circular dim stored as cos/sin pair)
# d_gene_rep = d_token + d_agg = 32 + 64 = 96
d_token: 32
d_agg: 64
d_gauss: 32
n_circular: 8
d_dec: 64
# Tissue conditions the decoder instead of the encoder, so the latent does
# not have to spend capacity on which site a cell came from.  Kept narrow:
# it carries four categorical levels, and a wide one would let the decoder
# lean on tissue for structure the latent should be learning.
d_tissue: 16
# Technical covariates for the decoder. 0 disables them; the encoder never sees
# them either way. Same width as d_tissue -- both are small categorical
# conditions and neither should rival d_agg.
d_platform: 16
n_groups: null      # populated from vocabulary.json at runtime
n_studies: null     # populated from data config at runtime

group_encoder:
  n_layers: 2
  n_heads: 4         # 32 / 4 = 8 dims per head
  dropout: 0.1
  # Size buckets for the 45 group encoders.  Real gene counts run 253-493,
  # and one padded block spends 49% of its attention arithmetic on padding.
  n_buckets: 4

aggregation_encoder:
  n_layers: 2
  n_heads: 4         # 64 / 4 = 16 dims per head
  dropout: 0.1

decoder:
  linear_only: true

# CCE: Contrastive Cell Embeddings
# enabled is the on/off switch; all other params live here.
cce:
  enabled: false
  temperature: 0.07
  lambda_cce: 0.1

# DAB: Domain Adversarial Batch correction
#
# The shape changed in October 2026, from one 64-unit ReLU layer with dropout
# 0.1 to three 256-unit LeakyReLU layers with LayerNorm and none. Every arm
# from r1 to m4 beat the old classifier without becoming study-invariant, and
# study_knn stayed at 0.88 while train_dab fell to 0.21 against ln(11) = 2.40.
# This is scGPT's AdversarialDiscriminator shape. See
# objectives/adversarial.py for what each part is for, and note that
# lambda_dab is NOT comparable across this change: a stronger classifier hands
# the encoder a different gradient at the same lambda.
dab:
  lambda_dab: 1.0
  hidden_dim: 256
  n_layers: 3
  normalise: true
  dropout: 0.0

# ECS: Elastic Cell Similarity. Off here; an arm that wants it sets
# enabled and model.loss.w_ecs, and should read
# objectives/elastic_similarity.py first, because the term SHARPENS the
# embedding and our failure mode is fragmentation rather than collapse.
ecs:
  enabled: false
  threshold: 0.8
  # 0 keeps every pair within one study, which is what PerStudyBatchSampler
  # serves. Non-zero holds that many previous batches as cross-study
  # reference points.
  buffer_batches: 0
