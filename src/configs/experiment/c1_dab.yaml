name: c1_dab
description: >
  c1_ref plus the adversarial study term at r8's strength.

  WHAT CHANGES. model.dab.lambda_dab 0.0 to 0.02 (pressure lambda x w_dab =
  0.01). The classifier already trains in c1_ref; here its reversed
  gradient reaches the encoder.

  WHAT IT MEASURES. How much donor and study identity the adversary removes
  from the latent (knn patient, val_dab) and what that costs on family and
  phase. c_ref's blow-up at epoch 16 (latent norm 2.3 to 24 in one epoch,
  classifier loss 2.3 to 20.7) is the failure mode to watch for; the
  family-selected checkpoint protects the result from it but not the run.
model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_c1.yaml

output_dir: outputs/c1_dab/
seed: 24

overrides:
  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6
  training.stop_metric: family_knn

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  # The study classifier trains and is logged (val_dab says how much study
  # the latent holds) but at lambda 0 its reversed gradient never reaches
  # the encoder. c1_dab turns it on.
  model.dab.lambda_dab: 0.02

  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false
  model.cce.every: 4

  # Gaussian only, at the width r8's combined latent had (8 + 4 circles as
  # cos/sin = 16). c1_circ hands 8 of these to four circles.
  model.d_gauss: 16
  model.n_circular: 0
  model.d_platform: 16
  model.d_disease: 0

  model.group_encoder.grad_checkpointing: true
