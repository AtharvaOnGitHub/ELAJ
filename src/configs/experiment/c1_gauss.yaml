name: c1_gauss
description: >
  c1_ref without the circular branch. The c1 series, arm 3. Gaussian only,
  at the same total latent width.

  THE QUESTION. Can a Gaussian latent alone explain the data at hand? The
  circular branch was the architectural hypothesis of waves R5 to R8: four
  Power Spherical dimensions for the menstrual cycle and the cell cycle. In
  r8_direction its dimensions were barely used (median kappa on the floor,
  circular half at 0.31 on cell family against 0.84 for the Gaussian half),
  and c1_wide collapsed three of four by epoch 7 when the Gaussian grew. This
  arm removes the branch and hands its width to the Gaussian, so the two
  models hold the same 16 numbers per cell and differ only in whether four
  of them are circles.

  WHAT CHANGES. n_circular 4 to 0; d_gauss 8 to 16. The combined latent stays 16
  wide, so PCA-16 and scVI-16 remain the width-matched baselines and the
  c1_ref row is comparable number for number. With n_circular at 0 the branch
  returns width-zero tensors: kl_circ is zero, CCE and DAB read the Gaussian
  embedding alone, and the circular figures are not drawn. kappa_floor,
  circular_parameterisation and w_kl_circ are kept in the overrides so this
  file diffs against c1_ref by two lines; they act on nothing.

  WHAT THIS IS NOT. Not a test of the bottleneck (that is c1_wide, stopped)
  and not a test of the input (that is c1_log, pending the probe). It is C6
  of the publication plan: what the circular branch was for and what
  happened, measured rather than inferred. If this arm matches or beats
  c1_ref on every headline number, the circular branch is a Discussion
  paragraph, not a Results section.

  CCE CADENCE. model.cce.every 4: the second encoder pass on every fourth
  step, about a third off the epoch. c1_ref (every step) and c1_nocce (none)
  are the two references this arm is read against.

  EPOCH BUDGET. About 1.2 M training cells at roughly 5,300 s/epoch; T_max
  22 in about 32 h. Check the first epoch time; above 7,800 s the run will
  not anneal before the wall.

model:    configs/model/ELAJ_small.yaml
training: configs/training/base.yaml
data:     configs/data/corpus_c1.yaml

output_dir: outputs/c1_gauss/
seed: 24

overrides:

  training.max_epochs: 22
  training.batch_size: 256

  training.diagnostics.log_every: 50
  training.diagnostics.latent_every: 5
  training.early_stop_patience: 7
  training.early_stop_warmup_epochs: 6
  training.stop_metric: family_knn

  training.optimizer.lr: 1.0e-3
  training.kl_annealing.beta_max: 0.5
  model.loss.w_kl_circ: 0.1
  model.loss.free_bits: 0.25
  model.loss.w_dab: 0.5

  model.dab.lambda_dab: 0.02
  model.cce.enabled: true
  model.cce.lambda_cce: 0.025
  model.cce.block_normalise: false
  model.cce.every: 4

  # The two lines this arm exists for.
  model.d_gauss: 16
  model.n_circular: 0
  model.d_platform: 16

  model.group_encoder.grad_checkpointing: true
  model.kappa_floor: 1.0
  model.circular_parameterisation: direction
